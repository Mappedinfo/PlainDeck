name: Publish PlainDeck packages to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install npm with OIDC trusted publishing support
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: npm ci
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          CORE_VERSION=$(node -p "require('./packages/plaindeck/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${CORE_VERSION}"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and CLI tests
        run: npm test
      - name: Renderer tests
        run: npm run test:render
      - name: Web build
        run: npm run build
      - name: Web end-to-end tests
        run: npm run test:e2e
      - name: Inspect package contents
        run: npm run test:pack
      - name: Publish plaindeck with provenance
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./packages/plaindeck/package.json').version")
          if npm view "plaindeck@${VERSION}" version >/dev/null 2>&1; then
            echo "plaindeck@${VERSION} is already published; skipping"
          else
            npm publish -w plaindeck --access public --provenance
          fi
